name: Vaibhav Naiyar
# From the resume and public GitHub repos (checked 2026-11-02). The scorer reads this.
summary: >-
  Final-year B.Tech CSE student at SRM University (graduates May 2027, GPA 8.92), based in India.
  AI Apprentice at a UK AI startup (remote) since July 2026: builds multi-agent demos shown to
  clients, a shared AG-UI/A2UI response-orchestration layer, a .docx survey platform streamed
  over AG-UI, OpenTelemetry tracing, and found a cross-tenant authorization bug.
  Freelance full-stack work shipped to production: CloudVidya Academy (Turborepo, two Next.js
  apps, Postgres/Prisma, Redis, NextAuth, Gemini embeddings + Qdrant search, Razorpay) and
  thelanguagesalon.com (Next.js, SSR/SEO, payments).
  Projects: a streaming RAG engine with a live operator console (Samsung PRISM GenAI hackathon;
  FastAPI, BM25 + embeddings, AG-UI, OpenTelemetry), a real-time collaborative drawing app over
  WebSockets with CI/CD, an uptime monitor with Redis Streams workers (TypeScript and Rust),
  a contest platform, an LMS, LangGraph agents with memory, an AI mail-assistant monorepo,
  WebRTC video calls, a Socket.io chess game, Solana and EVM token tools.
  Strongest at TypeScript/Next.js product engineering and agentic LLM apps; working knowledge
  of Python/FastAPI, Rust, Docker, Prometheus and Kubernetes basics. Looking for an engineering
  role or internship at an early-stage AI startup.
roles: [AI engineer, full-stack engineer, software engineer (SDE), forward deployed engineer, DevOps / platform engineer, agentic AI / LLM application engineer, founding engineer (junior)]
